# =============================================================================
# YFJ Matrimony - Nginx Configuration for AWS EC2
# Place at /etc/nginx/sites-available/yfj-matrimony
# Symlink to /etc/nginx/sites-enabled/
# =============================================================================

# Rate limiting zone (10 requests per second per IP)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name api.yfjmatrimony.com; # Replace with your EC2 public domain or Elastic IP

    # Allow Let's Encrypt / Certbot SSL validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect HTTP to HTTPS once SSL is installed
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.yfjmatrimony.com; # Replace with your EC2 public domain or Elastic IP

    # SSL Certificates (managed automatically by certbot)
    # ssl_certificate /etc/letsencrypt/live/api.yfjmatrimony.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.yfjmatrimony.com/privkey.pem;

    # SSL Optimization
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Maximum upload size for video/photo uploads
    client_max_body_size 100M;

    # Health check endpoint (for ALB or uptime monitors)
    location /health {
        proxy_pass http://127.0.0.1:5000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # API Proxy to Node.js / PM2
    location / {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # WebSocket support (for live chat)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for longer video uploads
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
